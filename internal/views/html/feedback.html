<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.title}}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <script src="https://unpkg.com/feather-icons"></script>
    <style>
        :root {
            --primary-color: #4361ee;
            --primary-hover: #3a56d4;
            --secondary-color: #f8f9fa;
            --text-color: #333;
            --error-color: #dc3545;
            --success-color: #198754;
            --box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }
        
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e8f0 100%);
            color: var(--text-color);
            min-height: 100vh;
            padding-top: 70px;
        }
        
        .navbar {
            box-shadow: 0 2px 15px rgba(0, 0, 0, 0.1);
            background-color: #ffffff !important;
            padding: 12px 0;
        }
        
        .navbar-brand {
            font-weight: 700;
            font-size: 1.5rem;
            color: var(--primary-color);
        }
        
        .nav-link {
            font-weight: 500;
            padding: 8px 16px !important;
            border-radius: 6px;
            transition: all 0.3s ease;
        }
        
        .nav-link:hover {
            background-color: rgba(67, 97, 238, 0.1);
        }
        
        .nav-link.active {
            color: var(--primary-color) !important;
        }
        
        .feedback-container {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
        }
        
        .feedback-card {
            background: white;
            border-radius: 16px;
            box-shadow: var(--box-shadow);
            padding: 40px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .page-title {
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 30px;
            font-size: 2rem;
            text-align: center;
            position: relative;
            padding-bottom: 15px;
        }
        
        .page-title::after {
            content: "";
            position: absolute;
            left: 50%;
            bottom: 0;
            transform: translateX(-50%);
            height: 3px;
            width: 80px;
            background: linear-gradient(to right, var(--primary-color), #6a11cb);
            border-radius: 3px;
        }
        
        .form-group {
            margin-bottom: 25px;
        }
        
        .form-label {
            font-weight: 600;
            margin-bottom: 10px;
            color: #555;
            font-size: 1rem;
            display: flex;
            align-items: center;
        }
        
        .form-label i {
            margin-right: 8px;
            color: var(--primary-color);
        }
        
        .form-control, .form-select {
            border-radius: 10px;
            padding: 12px 15px;
            border: 1px solid #dde1e7;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }
        
        .form-control:focus, .form-select:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 0.2rem rgba(67, 97, 238, 0.25);
        }
        
        textarea.form-control {
            min-height: 150px;
            resize: vertical;
        }
        
        .btn {
            border-radius: 10px;
            padding: 12px 28px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        .btn-primary {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
        }
        
        .btn-primary:hover {
            background-color: var(--primary-hover);
            border-color: var(--primary-hover);
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(67, 97, 238, 0.3);
        }
        
        .error-text {
            color: var(--error-color);
            font-size: 0.85rem;
            margin-top: 8px;
        }
        
        .g-recaptcha {
            margin-bottom: 20px;
        }
        
        /* Center recaptcha */
        .g-recaptcha > div {
            margin: 0 auto;
        }
        
        .rating-options {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        
        .rating-option {
            flex: 1;
            text-align: center;
            position: relative;
        }
        
        .rating-option input {
            position: absolute;
            opacity: 0;
            cursor: pointer;
        }
        
        .rating-label {
            display: block;
            padding: 12px;
            border-radius: 8px;
            background-color: #f8f9fa;
            border: 2px solid #e9ecef;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .rating-label:hover {
            background-color: #e9ecef;
            border-color: #dee2e6;
            transform: translateY(-2px);
        }
        
        .rating-option input:checked + .rating-label {
            background-color: rgba(67, 97, 238, 0.1);
            border-color: var(--primary-color);
        }
        
        .rating-emoji {
            font-size: 1.5rem;
            margin-bottom: 5px;
        }
        
        .rating-text {
            font-size: 0.9rem;
            font-weight: 500;
        }
        
        @media (max-width: 768px) {
            .feedback-card {
                padding: 25px;
            }
            
            .page-title {
                font-size: 1.7rem;
                margin-bottom: 20px;
            }
            
            .rating-options {
                flex-wrap: wrap;
            }
            
            .rating-option {
                flex-basis: 45%;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg fixed-top">
        <div class="container">
            <a class="navbar-brand" href="/">ElectiVote</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/electivote/home-page">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/electivote/profile-page">Profile</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/electivote/about-us-page">About Us</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/electivote/logout">Logout</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    
    <div class="feedback-container">
        <div class="feedback-card animate__animated animate__fadeIn">
            <h2 class="page-title">We Appreciate Your Feedback</h2>
            
            <form method="post">
                <div class="form-group">
                    <label for="feedback" class="form-label">
                        <i data-feather="message-square"></i>
                        Share Your Thoughts
                    </label>
                    <textarea 
                        class="form-control" 
                        id="feedback" 
                        name="feedback" 
                        placeholder="Tell us about your experience with ElectiVote..." 
                        required
                    >{{.feedbackMessage}}</textarea>
                    {{ if .feedbackMessageErr }}
                        <div class="error-text">{{.feedbackMessageErr}}</div>
                    {{end}}
                </div>
                
                <div class="form-group">
                    <label for="rating" class="form-label">
                        <i data-feather="star"></i>
                        How Would You Rate Your Experience?
                    </label>
                    <select 
                        class="form-select" 
                        id="rating" 
                        name="rating" 
                        required
                    >
                        <option value="0" {{ if eq .feedbackRate "0" }}selected{{end}}>Select a rating...</option>
                        <option value="5" {{ if eq .feedbackRate "5" }}selected{{end}}>Excellent</option>
                        <option value="4" {{ if eq .feedbackRate "4" }}selected{{end}}>Good</option>
                        <option value="3" {{ if eq .feedbackRate "3" }}selected{{end}}>Average</option>
                        <option value="2" {{ if eq .feedbackRate "2" }}selected{{end}}>Poor</option>
                        <option value="1" {{ if eq .feedbackRate "1" }}selected{{end}}>Very Poor</option>
                    </select>
                    {{ if .feedbackRateErr}}
                        <div class="error-text">{{.feedbackRateErr}}</div>
                    {{end}}
                </div>
                
                <div class="form-group text-center">
                    <div class="g-recaptcha" data-sitekey="{{.siteKey}}"></div>
                    {{if .captchaErr}}
                        <div class="error-text">{{.captchaErr}}</div>
                    {{end}}
                </div>
                
                <div class="text-center">
                    <button type="submit" class="btn btn-primary" style="width: 200px;">
                        <i data-feather="send" class="me-2" style="width: 18px; height: 18px;"></i>
                        Submit Feedback
                    </button>
                </div>
            </form>
        </div>
    </div>
    
    <script src="https://www.google.com/recaptcha/api.js?hl=en" async defer></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        feather.replace();
    </script>
</body>
</html>
