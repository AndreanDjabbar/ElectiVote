<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.title}}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <script src="https://unpkg.com/feather-icons"></script>
    <style>
        :root {
            --primary-color: #4361ee;
            --primary-hover: #3a56d4;
            --secondary-color: #f8f9fa;
            --text-color: #333;
            --warning-color: #ffc107;
            --warning-hover: #e0a800;
            --box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            --dark-color: #212529;
        }
        
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e8f0 100%);
            color: var(--text-color);
            min-height: 100vh;
            padding-top: 70px;
        }
        
        .navbar {
            box-shadow: 0 2px 15px rgba(0, 0, 0, 0.1);
            background-color: #ffffff !important;
            padding: 12px 0;
        }
        
        .navbar-brand {
            font-weight: 700;
            font-size: 1.5rem;
            color: var(--primary-color);
        }
        
        .nav-link {
            font-weight: 500;
            padding: 8px 16px !important;
            border-radius: 6px;
            transition: all 0.3s ease;
        }
        
        .nav-link:hover {
            background-color: rgba(67, 97, 238, 0.1);
        }
        
        .nav-link.active {
            color: var(--primary-color) !important;
        }
        
        .results-container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
        }
        
        .results-card {
            background: white;
            border-radius: 16px;
            box-shadow: var(--box-shadow);
            padding: 40px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            margin-bottom: 30px;
        }
        
        .results-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        }
        
        .page-title {
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 30px;
            font-size: 2rem;
            text-align: center;
            position: relative;
            padding-bottom: 15px;
        }
        
        .page-title::after {
            content: "";
            position: absolute;
            left: 50%;
            bottom: 0;
            transform: translateX(-50%);
            height: 3px;
            width: 60px;
            background: linear-gradient(to right, var(--primary-color), #6a11cb);
            border-radius: 3px;
        }
        
        .vote-title-card {
            background: linear-gradient(135deg, #4361ee 0%, #3a56d4 100%);
            color: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 5px 15px rgba(67, 97, 238, 0.3);
            transition: all 0.3s ease;
        }
        
        .vote-title-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(67, 97, 238, 0.4);
        }
        
        .vote-title {
            font-weight: 600;
            text-align: center;
            margin: 0;
            font-size: 1.5rem;
        }
        
        .chart-container {
            width: 100%;
            max-width: 600px;
            margin: 0 auto 30px;
            padding: 20px;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }
        
        .chart-canvas {
            width: 100%;
            height: 400px;
        }
        
        .custom-legend {
            display: flex;
            flex-direction: column;
            margin: 30px auto;
            max-width: 600px;
            background-color: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }
        
        .legend-title {
            font-weight: 600;
            color: var(--primary-color);
            margin-bottom: 15px;
            text-align: center;
            font-size: 1.2rem;
        }
        
        .custom-legend-item {
            display: flex;
            align-items: center;
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 8px;
            transition: all 0.3s ease;
        }
        
        .custom-legend-item:hover {
            background-color: #f8f9fa;
            transform: translateX(5px);
        }
        
        .legend-color-box {
            width: 20px;
            height: 20px;
            border-radius: 4px;
            margin-right: 15px;
            flex-shrink: 0;
        }
        
        .legend-text {
            font-weight: 500;
            font-size: 1rem;
            color: #444;
        }
        
        .legend-votes {
            margin-left: auto;
            font-weight: 600;
            color: var(--primary-color);
            padding: 4px 10px;
            border-radius: 20px;
            background-color: rgba(67, 97, 238, 0.1);
            font-size: 0.9rem;
        }
        
        .btn {
            border-radius: 10px;
            padding: 12px 28px;
            font-weight: 600;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .btn-warning {
            background-color: var(--warning-color);
            border-color: var(--warning-color);
        }
        
        .btn-warning:hover {
            background-color: var(--warning-hover);
            border-color: var(--warning-hover);
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(255, 193, 7, 0.3);
        }
        
        .empty-state {
            text-align: center;
            padding: 40px 20px;
        }
        
        .empty-icon {
            width: 80px;
            height: 80px;
            color: #adb5bd;
            margin-bottom: 20px;
        }
        
        .empty-title {
            font-weight: 600;
            color: #6c757d;
            margin-bottom: 15px;
            font-size: 1.4rem;
        }
        
        .empty-message {
            color: #6c757d;
            max-width: 400px;
            margin: 0 auto 30px;
            font-size: 1.1rem;
        }
        
        @media (max-width: 768px) {
            .results-card {
                padding: 30px 20px;
            }
            
            .page-title {
                font-size: 1.8rem;
            }
            
            .chart-canvas {
                height: 300px;
            }
            
            .legend-text {
                font-size: 0.9rem;
            }
            
            .legend-votes {
                font-size: 0.8rem;
            }
            
            .vote-title {
                font-size: 1.3rem;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg fixed-top">
        <div class="container">
            <a class="navbar-brand" href="/">ElectiVote</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="/electivote/home-page">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/electivote/profile-page">Profile</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/electivote/about-us-page">About Us</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/electivote/logout">Logout</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    
    <div class="results-container">
        <div class="results-card animate__animated animate__fadeIn">
            <h2 class="page-title">Vote Results</h2>
            
            {{ if .isExist }}
                <div class="vote-title-card animate__animated animate__fadeInUp">
                    <h3 class="vote-title">{{.voteTitle}}</h3>
                </div>
                
                <div class="chart-container animate__animated animate__fadeInUp animate__delay-1s">
                    <canvas id="votePieChart" class="chart-canvas"></canvas>
                </div>
                
                <div class="custom-legend animate__animated animate__fadeInUp animate__delay-2s">
                    <h4 class="legend-title">Detailed Results</h4>
                    <div id="customLegend"></div>
                </div>
            {{else}}
                <div class="empty-state animate__animated animate__fadeIn">
                    <i data-feather="bar-chart-2" class="empty-icon"></i>
                    <h3 class="empty-title">No Results Available</h3>
                    <p class="empty-message">There are no votes recorded for this poll yet, or the poll doesn't exist.</p>
                </div>
            {{end}}
            
            <div class="text-center animate__animated animate__fadeInUp animate__delay-3s">
                <a href="/electivote/manage-vote-page/{{.voteData.VoteID}}" class="btn btn-warning">
                    <i data-feather="arrow-left" style="width: 18px; height: 18px;"></i>
                    Back to Manage Vote
                </a>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        feather.replace();
        
        document.addEventListener('DOMContentLoaded', function () {
            {{ if .isExist}}
            const candidatesJson = '{{ .candidatesJson }}';
            const candidates = JSON.parse(candidatesJson);

            // Generate unique colors with better contrast
            function generateColors(count) {
                const baseColors = [
                    '#4361ee', '#3a0ca3', '#f72585', '#4cc9f0', '#4895ef',
                    '#560bad', '#f3722c', '#f8961e', '#f9c74f', '#90be6d',
                    '#43aa8b', '#577590', '#277da1', '#6d597a', '#e56b6f'
                ];
                
                // Return from base colors if we have enough
                if (count <= baseColors.length) {
                    return baseColors.slice(0, count);
                }
                
                // Generate additional colors if needed
                const colors = [...baseColors];
                for (let i = baseColors.length; i < count; i++) {
                    const hue = Math.floor(Math.random() * 360);
                    const saturation = 70 + Math.floor(Math.random() * 30);
                    const lightness = 45 + Math.floor(Math.random() * 10);
                    colors.push(`hsl(${hue}, ${saturation}%, ${lightness}%)`);
                }
                
                return colors;
            }

            const colors = generateColors(candidates.length);
            const totalVotes = candidates.reduce((sum, candidate) => sum + candidate.TotalVotes, 0);

            // Sort candidates by vote count (descending)
            candidates.sort((a, b) => b.TotalVotes - a.TotalVotes);

            // Chart.js configuration
            const ctx = document.getElementById('votePieChart').getContext('2d');
            
            // Create the chart
            const myChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: candidates.map(c => c.CandidateName),
                    datasets: [{
                        data: candidates.map(c => c.TotalVotes),
                        backgroundColor: colors,
                        borderColor: 'white',
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    cutout: '60%',
                    plugins: {
                        legend: {
                            display: false
                        },
                        tooltip: {
                            backgroundColor: 'rgba(255, 255, 255, 0.9)',
                            titleColor: '#333',
                            bodyColor: '#333',
                            bodyFont: {
                                family: 'Poppins, sans-serif',
                                weight: '500'
                            },
                            titleFont: {
                                family: 'Poppins, sans-serif',
                                weight: '600'
                            },
                            padding: 12,
                            boxWidth: 10,
                            boxHeight: 10,
                            boxPadding: 3,
                            usePointStyle: true,
                            callbacks: {
                                label: function(tooltipItem) {
                                    const percentage = ((tooltipItem.raw / totalVotes) * 100).toFixed(1);
                                    return `${tooltipItem.raw} votes (${percentage}%)`;
                                }
                            }
                        }
                    },
                    animation: {
                        animateScale: true,
                        animateRotate: true
                    }
                }
            });

            // Create a custom legend with more details
            const customLegend = document.getElementById('customLegend');
            candidates.forEach((candidate, index) => {
                const percentage = ((candidate.TotalVotes / totalVotes) * 100).toFixed(1);
                
                const legendItem = document.createElement('div');
                legendItem.className = 'custom-legend-item';
                
                const colorBox = document.createElement('div');
                colorBox.className = 'legend-color-box';
                colorBox.style.backgroundColor = colors[index];
                
                const nameText = document.createElement('span');
                nameText.className = 'legend-text';
                nameText.textContent = candidate.CandidateName;
                
                const votesText = document.createElement('span');
                votesText.className = 'legend-votes';
                votesText.textContent = `${candidate.TotalVotes} votes (${percentage}%)`;
                
                legendItem.appendChild(colorBox);
                legendItem.appendChild(nameText);
                legendItem.appendChild(votesText);
                
                // Add hover interaction with the chart
                legendItem.addEventListener('mouseenter', () => {
                    myChart.setActiveElements([{datasetIndex: 0, index: index}]);
                    myChart.update();
                });
                
                legendItem.addEventListener('mouseleave', () => {
                    myChart.setActiveElements([]);
                    myChart.update();
                });
                
                customLegend.appendChild(legendItem);
            });
            
            // Add total votes summary
            const totalItem = document.createElement('div');
            totalItem.className = 'custom-legend-item';
            totalItem.style.marginTop = '15px';
            totalItem.style.borderTop = '1px solid #eee';
            totalItem.style.paddingTop = '15px';
            
            const totalText = document.createElement('span');
            totalText.className = 'legend-text';
            totalText.style.fontWeight = '600';
            totalText.textContent = 'Total Votes';
            
            const totalVotesText = document.createElement('span');
            totalVotesText.className = 'legend-votes';
            totalVotesText.style.backgroundColor = 'rgba(0, 0, 0, 0.1)';
            totalVotesText.style.color = '#333';
            totalVotesText.textContent = totalVotes;
            
            totalItem.appendChild(totalText);
            totalItem.appendChild(totalVotesText);
            customLegend.appendChild(totalItem);
            {{end}}
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
