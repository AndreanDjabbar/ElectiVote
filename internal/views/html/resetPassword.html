<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.title}}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <script src="https://unpkg.com/feather-icons"></script>
    <style>
        :root {
            --primary-color: #4361ee;
            --primary-hover: #3a56d4;
            --secondary-color: #f8f9fa;
            --text-color: #333;
            --error-color: #dc3545;
            --success-color: #198754;
            --warning-color: #ffc107;
            --warning-hover: #e0a800;
            --box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }
        
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e8f0 100%);
            color: var(--text-color);
            min-height: 100vh;
            padding-top: 70px;
        }
        
        .navbar {
            box-shadow: 0 2px 15px rgba(0, 0, 0, 0.1);
            background-color: #ffffff !important;
            padding: 12px 0;
        }
        
        .navbar-brand {
            font-weight: 700;
            font-size: 1.5rem;
            color: var(--primary-color);
        }
        
        .nav-link {
            font-weight: 500;
            padding: 8px 16px !important;
            border-radius: 6px;
            transition: all 0.3s ease;
        }
        
        .nav-link:hover {
            background-color: rgba(67, 97, 238, 0.1);
        }
        
        .nav-link.active {
            color: var(--primary-color) !important;
        }
        
        .reset-password-container {
            max-width: 700px;
            margin: 40px auto;
            padding: 0 20px;
        }
        
        .form-card {
            background: white;
            border-radius: 16px;
            box-shadow: var(--box-shadow);
            padding: 40px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .page-title {
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 30px;
            font-size: 2rem;
            text-align: center;
            position: relative;
            padding-bottom: 15px;
        }
        
        .page-title::after {
            content: "";
            position: absolute;
            left: 50%;
            bottom: 0;
            transform: translateX(-50%);
            height: 3px;
            width: 60px;
            background: linear-gradient(to right, var(--primary-color), #6a11cb);
            border-radius: 3px;
        }
        
        .page-subtitle {
            text-align: center;
            color: #6c757d;
            margin-bottom: 30px;
            font-size: 1.1rem;
        }
        
        .password-icon-container {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .password-icon-circle {
            width: 110px;
            height: 110px;
            background: rgba(67, 97, 238, 0.1);
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 5px 15px rgba(67, 97, 238, 0.2);
            transition: all 0.3s ease;
        }
        
        .password-icon-circle:hover {
            transform: scale(1.05);
            background: rgba(67, 97, 238, 0.15);
            box-shadow: 0 8px 25px rgba(67, 97, 238, 0.3);
        }
        
        .password-icon {
            color: var(--primary-color);
            width: 50px;
            height: 50px;
        }
        
        .form-group {
            margin-bottom: 25px;
        }
        
        .form-label {
            font-weight: 600;
            margin-bottom: 10px;
            color: #555;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .required::after {
            content: "*";
            color: var(--error-color);
            margin-left: 4px;
        }
        
        .form-control {
            border-radius: 10px;
            padding: 15px;
            border: 1px solid #dde1e7;
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        
        .form-control:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 0.2rem rgba(67, 97, 238, 0.25);
        }
        
        .password-container {
            position: relative;
        }
        
        .toggle-password {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #6c757d;
            transition: all 0.3s ease;
        }
        
        .toggle-password:hover {
            color: var(--primary-color);
        }
        
        .error-text {
            color: var(--error-color);
            font-size: 0.85rem;
            margin-top: 8px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .password-strength {
            margin-top: 10px;
        }
        
        .strength-label {
            font-size: 0.85rem;
            margin-bottom: 5px;
            color: #6c757d;
        }
        
        .strength-meter {
            height: 5px;
            background: #e9ecef;
            border-radius: 5px;
            overflow: hidden;
        }
        
        .strength-meter-fill {
            height: 100%;
            border-radius: 5px;
            transition: all 0.3s ease;
        }
        
        .strength-weak {
            width: 25%;
            background: var(--error-color);
        }
        
        .strength-medium {
            width: 50%;
            background: var(--warning-color);
        }
        
        .strength-strong {
            width: 75%;
            background: #17a2b8;
        }
        
        .strength-very-strong {
            width: 100%;
            background: var(--success-color);
        }
        
        .strength-text {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            margin-top: 5px;
        }
        
        .password-requirements {
            background-color: rgba(67, 97, 238, 0.05);
            border-radius: 10px;
            padding: 15px;
            margin-top: 25px;
            margin-bottom: 25px;
        }
        
        .requirements-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            color: var(--primary-color);
            margin-bottom: 10px;
        }
        
        .requirements-list {
            list-style-type: none;
            padding-left: 0;
            margin-bottom: 0;
        }
        
        .requirements-list li {
            position: relative;
            padding-left: 25px;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: #555;
            display: flex;
            align-items: center;
        }
        
        .requirements-list li i {
            position: absolute;
            left: 0;
            color: #adb5bd;
        }
        
        .buttons-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }
        
        .btn {
            border-radius: 10px;
            padding: 12px 28px;
            font-weight: 600;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .btn-primary {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
        }
        
        .btn-primary:hover {
            background-color: var(--primary-hover);
            border-color: var(--primary-hover);
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(67, 97, 238, 0.3);
        }
        
        .btn-warning {
            background-color: var(--warning-color);
            border-color: var(--warning-color);
        }
        
        .btn-warning:hover {
            background-color: var(--warning-hover);
            border-color: var(--warning-hover);
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(255, 193, 7, 0.3);
        }
        
        @media (max-width: 768px) {
            .form-card {
                padding: 30px 20px;
            }
            
            .page-title {
                font-size: 1.8rem;
            }
            
            .buttons-container {
                flex-direction: column;
            }
            
            .btn {
                width: 100% !important;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg fixed-top">
        <div class="container">
            <a class="navbar-brand" href="/">ElectiVote</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="/electivote/home-page">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/electivote/profile-page">Profile</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/electivote/about-us-page">About Us</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/electivote/logout">Logout</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    
    <div class="reset-password-container">
        <div class="form-card animate__animated animate__fadeIn">
            <div class="password-icon-container animate__animated animate__fadeInDown">
                <div class="password-icon-circle">
                    <i data-feather="lock" class="password-icon"></i>
                </div>
            </div>
            
            <h2 class="page-title">Reset Password</h2>
            <p class="page-subtitle">Create a new password for your ElectiVote account</p>
            
            <form method="post" enctype="multipart/form-data" class="animate__animated animate__fadeInUp animate__delay-1s">
                <div class="form-group">
                    <label for="password" class="form-label required">
                        <i data-feather="lock" style="width: 16px; height: 16px;"></i>
                        New Password
                    </label>
                    <div class="password-container">
                        <input 
                            type="password" 
                            class="form-control" 
                            id="password" 
                            name="password" 
                            value="{{.password}}" 
                            placeholder="Enter your new secure password"
                            required
                        >
                        <i data-feather="eye" class="toggle-password" id="togglePassword"></i>
                    </div>
                    
                    {{if .passwordErr}}
                        <div class="error-text">
                            <i data-feather="alert-circle" style="width: 16px; height: 16px;"></i>
                            {{.passwordErr}}
                        </div>
                    {{end}}
                
                <div class="buttons-container">
                    <a href="../home-page" class="btn btn-warning" style="width: 180px;">
                        <i data-feather="x" style="width: 18px; height: 18px;"></i>
                        Cancel
                    </a>
                    <button type="submit" class="btn btn-primary" style="width: 180px;">
                        <i data-feather="check" style="width: 18px; height: 18px;"></i>
                        Reset Password
                    </button>
                </div>
            </form>
        </div>
    </div>
    
    <script>
        feather.replace();
        
        // Toggle password visibility
        document.getElementById('togglePassword').addEventListener('click', function() {
            const passwordInput = document.getElementById('password');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                this.setAttribute('data-feather', 'eye-off');
            } else {
                passwordInput.type = 'password';
                this.setAttribute('data-feather', 'eye');
            }
            feather.replace();
        });
        
        // Password strength meter
        const passwordInput = document.getElementById('password');
        const strengthMeter = document.getElementById('strengthMeter');
        const lengthCheck = document.getElementById('length-check');
        const uppercaseCheck = document.getElementById('uppercase-check');
        const lowercaseCheck = document.getElementById('lowercase-check');
        const numberCheck = document.getElementById('number-check');
        const specialCheck = document.getElementById('special-check');
        
        passwordInput.addEventListener('input', function() {
            const password = this.value;
            
            // Check each requirement
            const hasLength = password.length >= 8;
            const hasUppercase = /[A-Z]/.test(password);
            const hasLowercase = /[a-z]/.test(password);
            const hasNumber = /[0-9]/.test(password);
            const hasSpecial = /[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]/.test(password);
            
            // Update requirement indicators
            updateRequirement(lengthCheck, hasLength);
            updateRequirement(uppercaseCheck, hasUppercase);
            updateRequirement(lowercaseCheck, hasLowercase);
            updateRequirement(numberCheck, hasNumber);
            updateRequirement(specialCheck, hasSpecial);
            
            // Calculate strength
            let strength = 0;
            if (hasLength) strength += 1;
            if (hasUppercase) strength += 1;
            if (hasLowercase) strength += 1;
            if (hasNumber) strength += 1;
            if (hasSpecial) strength += 1;
            
            // Update meter
            strengthMeter.className = 'strength-meter-fill';
            if (password.length === 0) {
                strengthMeter.style.width = '0%';
            } else if (strength <= 1) {
                strengthMeter.classList.add('strength-weak');
            } else if (strength <= 2) {
                strengthMeter.classList.add('strength-medium');
            } else if (strength <= 3) {
                strengthMeter.classList.add('strength-strong');
            } else {
                strengthMeter.classList.add('strength-very-strong');
            }
        });
        
        function updateRequirement(element, isValid) {
            if (isValid) {
                element.querySelector('i').setAttribute('data-feather', 'check');
                element.querySelector('i').style.color = '#198754';
            } else {
                element.querySelector('i').setAttribute('data-feather', 'x');
                element.querySelector('i').style.color = '#adb5bd';
            }
            feather.replace();
        }
        
        // Check initial password (if there's a value already)
        if (passwordInput.value) {
            passwordInput.dispatchEvent(new Event('input'));
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
