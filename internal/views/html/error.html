<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.title}}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <script src="https://unpkg.com/feather-icons"></script>
    <style>
        :root {
            --primary-color: #4361ee;
            --primary-hover: #3a56d4;
            --secondary-color: #f8f9fa;
            --text-color: #333;
            --error-color: #dc3545;
            --error-hover: #bb2d3b;
            --box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }
        
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e8f0 100%);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .error-container {
            max-width: 700px;
            width: 100%;
        }
        
        .error-card {
            background: white;
            border-radius: 16px;
            box-shadow: var(--box-shadow);
            padding: 40px;
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .error-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        }
        
        .error-icon {
            color: var(--error-color);
            width: 80px;
            height: 80px;
            margin-bottom: 25px;
        }
        
        .error-title {
            font-weight: 600;
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: var(--error-color);
        }
        
        .error-message {
            color: var(--text-color);
            font-size: 1.1rem;
            margin-bottom: 30px;
            padding: 0 10px;
        }
        
        .back-button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }
        
        .back-button:hover {
            background-color: var(--primary-hover);
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(67, 97, 238, 0.3);
            color: white;
        }
        
        /* Loading animation */
        .loading-bar {
            height: 4px;
            width: 100%;
            background: #f1f1f1;
            border-radius: 4px;
            overflow: hidden;
            position: relative;
            margin: 30px 0;
        }
        
        .loading-bar::before {
            content: "";
            position: absolute;
            left: -50%;
            height: 100%;
            width: 50%;
            background: linear-gradient(to right, transparent, var(--primary-color));
            animation: loading 1.5s infinite linear;
        }
        
        @keyframes loading {
            0% {
                left: -50%;
            }
            100% {
                left: 150%;
            }
        }
        
        @media (max-width: 576px) {
            .error-card {
                padding: 30px 20px;
            }
            
            .error-icon {
                width: 60px;
                height: 60px;
            }
            
            .error-title {
                font-size: 1.3rem;
            }
            
            .error-message {
                font-size: 0.95rem;
            }
        }
    </style>
</head>
<body>
    <div class="error-container animate__animated animate__fadeIn">
        <div class="error-card">
            <div class="logo" style="font-size: 1.8rem; font-weight: 700; color: var(--primary-color); margin-bottom: 30px; display: flex; align-items: center; justify-content: center; gap: 10px;">
                <i data-feather="check-square" style="width: 30px; height: 30px;"></i>
                ElectiVote
            </div>
            
            <i data-feather="alert-triangle" class="error-icon"></i>
            
            <h2 class="error-title">Oops! Something went wrong</h2>
            
            <p class="error-message">{{.error}}</p>
            
            <div class="loading-bar"></div>
            
            <a href="{{.source}}" class="back-button">
                <i data-feather="arrow-left" style="width: 18px; height: 18px;"></i>
                Go Back
            </a>
        </div>
    </div>
    
    <script>
        // Initialize feather icons
        document.addEventListener('DOMContentLoaded', function() {
            feather.replace();
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/feather-icons"></script>
</body>
</html>
