<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.title}}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <script src="https://unpkg.com/feather-icons"></script>
    <style>
        :root {
            --primary-color: #4361ee;
            --primary-hover: #3a56d4;
            --secondary-color: #f8f9fa;
            --text-color: #333;
            --error-color: #dc3545;
            --warning-color: #ffc107;
            --warning-hover: #e0a800;
            --box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }
        
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e8f0 100%);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .forgot-password-container {
            max-width: 600px;
            width: 100%;
        }
        
        .form-card {
            background: white;
            border-radius: 16px;
            box-shadow: var(--box-shadow);
            padding: 40px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .page-title {
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 30px;
            font-size: 2rem;
            text-align: center;
            position: relative;
            padding-bottom: 15px;
        }
        
        .page-title::after {
            content: "";
            position: absolute;
            left: 50%;
            bottom: 0;
            transform: translateX(-50%);
            height: 3px;
            width: 60px;
            background: linear-gradient(to right, var(--primary-color), #6a11cb);
            border-radius: 3px;
        }
        
        .page-subtitle {
            text-align: center;
            color: #6c757d;
            margin-bottom: 30px;
            font-size: 1.1rem;
        }
        
        .password-icon-container {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .password-icon-circle {
            width: 110px;
            height: 110px;
            background: rgba(67, 97, 238, 0.1);
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 5px 15px rgba(67, 97, 238, 0.2);
            transition: all 0.3s ease;
        }
        
        .password-icon-circle:hover {
            transform: scale(1.05);
            background: rgba(67, 97, 238, 0.15);
            box-shadow: 0 8px 25px rgba(67, 97, 238, 0.3);
        }
        
        .password-icon {
            color: var(--primary-color);
            width: 50px;
            height: 50px;
        }
        
        .form-group {
            margin-bottom: 25px;
        }
        
        .form-label {
            font-weight: 600;
            margin-bottom: 10px;
            color: #555;
            font-size: 1rem;
            display: flex;
            align-items: center;
        }
        
        .form-label i {
            margin-right: 8px;
            color: var(--primary-color);
        }
        
        .required::after {
            content: "*";
            color: var(--error-color);
            margin-left: 4px;
        }
        
        .form-control {
            border-radius: 10px;
            padding: 15px;
            border: 1px solid #dde1e7;
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        
        .form-control:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 0.2rem rgba(67, 97, 238, 0.25);
        }
        
        .error-text {
            color: var(--error-color);
            font-size: 0.85rem;
            margin-top: 8px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .buttons-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }
        
        .btn {
            border-radius: 10px;
            padding: 12px 28px;
            font-weight: 600;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .btn-primary {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
        }
        
        .btn-primary:hover {
            background-color: var(--primary-hover);
            border-color: var(--primary-hover);
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(67, 97, 238, 0.3);
        }
        
        .btn-warning {
            background-color: var(--warning-color);
            border-color: var(--warning-color);
        }
        
        .btn-warning:hover {
            background-color: var(--warning-hover);
            border-color: var(--warning-hover);
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(255, 193, 7, 0.3);
        }
        
        .help-text {
            background-color: rgba(67, 97, 238, 0.05);
            border-radius: 10px;
            padding: 15px;
            margin-top: 25px;
        }
        
        .help-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            color: var(--primary-color);
            margin-bottom: 10px;
        }
        
        .help-message {
            color: #555;
            font-size: 0.9rem;
            margin-bottom: 0;
        }
        
        @media (max-width: 768px) {
            .form-card {
                padding: 30px 20px;
            }
            
            .page-title {
                font-size: 1.8rem;
            }
            
            .buttons-container {
                flex-direction: column;
            }
            
            .btn {
                width: 100% !important;
            }
        }
        
        .login-link {
            text-align: center;
            margin-top: 25px;
            font-size: 0.95rem;
            color: #6c757d;
        }
        
        .login-link a {
            color: var(--primary-color);
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
        }
        
        .login-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="forgot-password-container">
        <div class="form-card animate__animated animate__fadeIn">
            <div class="password-icon-container animate__animated animate__fadeInDown">
                <div class="password-icon-circle">
                    <i data-feather="key" class="password-icon"></i>
                </div>
            </div>
            
            <h1 class="page-title">Forgot Password?</h1>
            <p class="page-subtitle">Enter your email address and we'll send you a link to reset your password</p>
            
            <form method="post" enctype="multipart/form-data" class="animate__animated animate__fadeInUp animate__delay-1s">
                <div class="form-group">
                    <label for="email" class="form-label required">
                        <i data-feather="mail" style="width: 16px; height: 16px;"></i>
                        Email Address
                    </label>
                    <input 
                        type="email" 
                        class="form-control" 
                        id="email" 
                        name="email" 
                        value="{{.email}}" 
                        placeholder="Enter your registered email address"
                        required
                    >
                    {{if .emailErr}}
                        <div class="error-text">
                            <i data-feather="alert-circle" style="width: 16px; height: 16px;"></i>
                            {{.emailErr}}
                        </div>
                    {{end}}
                </div>
                
                <div class="buttons-container">
                    <a href="../home-page" class="btn btn-warning" style="width: 180px;">
                        <i data-feather="x" style="width: 18px; height: 18px;"></i>
                        Cancel
                    </a>
                    <button type="submit" class="btn btn-primary" style="width: 180px;">
                        <i data-feather="send" style="width: 18px; height: 18px;"></i>
                        Submit
                    </button>
                </div>
                
                <div class="login-link">
                    Remember your password? <a href="../login-page">Login here</a>
                </div>
            </form>
        </div>
    </div>
    
    <script>
        feather.replace();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
