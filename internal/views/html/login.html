<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.title}}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <style>
        :root {
            --primary-color: #4361ee;
            --primary-hover: #3a56d4;
            --secondary-color: #f8f9fa;
            --text-color: #333;
            --error-color: #dc3545;
            --success-color: #198754;
            --box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }
        
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e8f0 100%);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .main-container {
            width: 100%;
            margin: 10px 50px;
        }
        
        .logo-text {
            font-weight: 700;
            color: var(--primary-color);
            letter-spacing: 1px;
            margin-bottom: 1.5rem;
            font-size: 2.5rem;
        }
        
        .form-card {
            background: white;
            border-radius: 12px;
            box-shadow: var(--box-shadow);
            padding: 2.5rem;
            max-width: 500px;
            width: 100%;
            margin: 0 auto;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .form-control {
            border-radius: 8px;
            padding: 0.75rem 1rem;
            border: 1px solid #dde1e7;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }
        
        .form-control:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 0.2rem rgba(67, 97, 238, 0.25);
        }
        
        .error-text {
            color: var(--error-color);
            font-size: 0.85rem;
            margin-top: 0.35rem;
        }
        
        .password-container {
            position: relative;
        }
        
        .password-container input {
            padding-right: 40px;
        }
        
        .password-container .toggle-password {
            position: absolute;
            top: 50%;
            right: 15px;
            transform: translateY(-50%);
            cursor: pointer;
            opacity: 0.7;
            transition: opacity 0.2s ease;
        }
        
        .password-container .toggle-password:hover {
            opacity: 1;
        }
        
        .password-container .toggle-password img {
            width: 20px;
            height: 20px;
        }
        
        .btn-primary {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
            border-radius: 8px;
            padding: 0.75rem 1.5rem;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        
        .btn-primary:hover {
            background-color: var(--primary-hover);
            border-color: var(--primary-hover);
            transform: translateY(-2px);
        }
        
        .form-label {
            font-weight: 500;
            margin-bottom: 0.5rem;
            color: #555;
        }
        
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        .link-primary {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s ease;
        }
        
        .link-primary:hover {
            color: var(--primary-hover);
            text-decoration: underline;
        }
        
        .g-recaptcha {
            margin-bottom: 1rem;
        }
        
        .g-recaptcha > div {
            margin: 0 auto;
        }
        
        .form-check-input:checked {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
        }
        
        .remember-forgot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }
        
        @media (max-width: 768px) {
            .form-card {
                padding: 1.8rem;
                margin: 1rem;
            }
            
            .logo-text {
                font-size: 2rem;
            }
            
            .remember-forgot {
                flex-direction: column;
                align-items: flex-start;
                gap: 0.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="form-card animate__animated animate__fadeIn">
            <h1 class="text-center logo-text">ElectiVote</h1>
            <p class="text-center text-muted mb-4">Sign in to your account</p>
            
            <form method="post" class="needs-validation" novalidate>
                <div class="form-group">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" id="username" name="username" 
                        value="{{.username}}"
                        placeholder="Enter your username" class="form-control" required />
                    {{if .usernameErr}}
                    <div class="error-text">{{.usernameErr}}</div>
                    {{end}}
                </div>
                
                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <div class="password-container">
                        <input type="password" id="password" name="password" 
                            value="{{.password}}"
                            placeholder="Enter your password" class="form-control" required />
                        <span class="toggle-password">
                            <img src="/images/eye.svg" alt="Show Password" class="eye-icon" />
                        </span>
                        {{if .passwordErr}}
                        <div class="error-text">{{.passwordErr}}</div>
                        {{end}}
                    </div>
                </div>
                
                <div class="form-group text-center">
                    <div class="g-recaptcha" data-sitekey="{{.siteKey}}"></div>
                    {{if .captchaErr}}
                    <div class="error-text text-center">{{.captchaErr}}</div>
                    {{end}}
                </div>
                
                <div class="remember-forgot">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" value="on" name="remember" id="remember" />
                        <label class="form-check-label" for="remember">Remember me</label>
                    </div>
                    <a href="../forgot-password-page" class="link-primary">Forgot password?</a>
                </div>
                
                <button type="submit" class="btn btn-primary w-100 mb-3">Sign In</button>
                
                <div class="text-center mt-4">
                    <p>Don't have an account? <a href="../register-page" class="link-primary">Sign up</a></p>
                </div>
            </form>
        </div>
    </div>

    <script src="https://www.google.com/recaptcha/api.js?hl=en" async defer></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.querySelectorAll('.toggle-password').forEach(function (eyeIcon) {
            eyeIcon.addEventListener('click', function () {
                const passwordInput = this.previousElementSibling;
                const eyeImage = this.querySelector('.eye-icon');

                if (passwordInput.type === 'password') {
                    passwordInput.type = 'text';
                    eyeImage.src = "/images/eye-closed.svg";
                    eyeImage.alt = "Hide Password";
                } else {
                    passwordInput.type = 'password';
                    eyeImage.src = '/images/eye.svg'; 
                    eyeImage.alt = "Show Password";
                }
            });
        });

        (() => {
            'use strict';
            
            const forms = document.querySelectorAll('.needs-validation');
            
            Array.prototype.slice.call(forms).forEach((form) => {
                form.addEventListener('submit', (event) => {
                    if (!form.checkValidity()) {
                        event.preventDefault();
                        event.stopPropagation();
                    }
                    
                    form.classList.add('was-validated');
                }, false);
            });
        })();
    </script>
</body>
</html>
