<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.title}}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        .password-container {
            position: relative;
        }

        .password-container input {
            padding-right: 40px; /* Space for the toggle eye icon */
        }

        .toggle-password {
            position: absolute;
            right: 10px; /* Adjust as needed */
            transform: translateY(-50%);
            cursor: pointer;
        }

        .toggle-password img {
            width: 20px; /* Size of the eye icon */
            height: 20px; /* Size of the eye icon */
        }

        .error {
            position: relative;
        }

        .error .toggle-password {
            top: 25%; /* Position for error */
        }

        .no-error .toggle-password {
            top: 50%; /* Position when no error */
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="row justify-content-center" style="margin-top: 100px;">
            <div style="display: flex; flex-direction: column; justify-content: center; width: 60%; margin-top: 60px">
                <h1 class="text-center">ElectiVote</h1>
            </div>
            <form style="display: flex; flex-direction: column; justify-content: center; width: 530px; margin-top: 60px" method="post">
                <div data-mdb-input-init class="form-outline mb-4">
                    {{if .usernameErr}}
                    <input type="text" id="username" name="username" placeholder="Username" value="{{.username}}" class="form-control" required />
                    <p style="color: red;">{{.usernameErr}}</p>
                    {{else}}
                    <input type="text" id="username" name="username" value="{{.username}}" placeholder="Username" class="form-control" required />
                    {{end}}
                </div>
                <div class="password-container form-outline mb-4 {{if .passwordErr}}error{{else}}no-error{{end}}">
                    <input type="password" id="password" name="password" placeholder="Password" value="{{.password}}" class="form-control" required />
                    <span class="toggle-password">
                        {{if .passwordErr}}
                        <img src="/images/eye-closed.svg" alt="Show Password" class="eye-icon" />
                        {{else}}
                        <img src="/images/eye.svg" alt="Show Password" class="eye-icon" />
                        {{end}}
                    </span>
                    {{if .passwordErr}}
                    <p style="color: red; margin-top: 5px;">{{.passwordErr}}</p>
                    {{end}}
                </div>
                <div data-mdb-input-init class="form-outline mb-4" style="display: flex; flex-direction: column; align-items: center; justify-content: center;">
                    {{if .captchaErr}}
                    <div class="g-recaptcha" data-sitekey="{{.siteKey}}"></div>
                    <p style="color: red;" class="text-center">{{.captchaErr}}</p>
                    {{else}}
                    <div class="g-recaptcha" data-sitekey="{{.siteKey}}"></div>
                    {{end}}
                </div>
                <div class="row mb-4">
                    <div class="col d-flex justify-content-center">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" value="on" name="remember" id="remember" />
                            <label class="form-check-label" for="remember"> Remember me </label>
                        </div>
                    </div>
                    <div class="col">
                        <a href="../forgot-password-page">Forgot password?</a>
                    </div>
                </div>
                <button type="submit" data-mdb-button-init data-mdb-ripple-init class="btn btn-primary btn-block mb-4">Sign in</button>
                <div class="text-center">
                    <p>Don't have an account? <a href="../register-page">sign-up</a></p>
                </div>
            </form>
        </div>
    </div>
    <br><br><br><br><br><br>
    <script src="https://www.google.com/recaptcha/api.js?hl=en" async defer></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous">
    </script>
    <script>
        document.querySelectorAll('.toggle-password').forEach(function (eyeIcon) {
            eyeIcon.addEventListener('click', function () {
                const passwordInput = eyeIcon.previousElementSibling;
                const eyeImage = eyeIcon.querySelector('.eye-icon');

                if (passwordInput.type === 'password') {
                    passwordInput.type = 'text';
                    eyeImage.src = "/images/eye-closed.svg";
                    eyeImage.alt = "Hide Password";
                } else {
                    passwordInput.type = 'password';
                    eyeImage.src = '/images/eye.svg';
                    eyeImage.alt = "Show Password";
                }
            });
        });
    </script>
</body>

</html>
