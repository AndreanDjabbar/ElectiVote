<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.title}}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <script src="https://unpkg.com/feather-icons"></script>
    <style>
        :root {
            --primary-color: #4361ee;
            --primary-hover: #3a56d4;
            --secondary-color: #f8f9fa;
            --text-color: #333;
            --error-color: #dc3545;
            --success-color: #198754;
            --warning-color: #ffc107;
            --warning-hover: #e0a800;
            --box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }
        
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e8f0 100%);
            color: var(--text-color);
            min-height: 100vh;
            padding-top: 70px;
        }
        
        .navbar {
            box-shadow: 0 2px 15px rgba(0, 0, 0, 0.1);
            background-color: #ffffff !important;
            padding: 12px 0;
        }
        
        .navbar-brand {
            font-weight: 700;
            font-size: 1.5rem;
            color: var(--primary-color);
        }
        
        .nav-link {
            font-weight: 500;
            padding: 8px 16px !important;
            border-radius: 6px;
            transition: all 0.3s ease;
        }
        
        .nav-link:hover {
            background-color: rgba(67, 97, 238, 0.1);
        }
        
        .nav-link.active {
            color: var(--primary-color) !important;
        }
        
        .add-candidate-container {
            max-width: 700px;
            margin: 40px auto;
            padding: 0 20px;
        }
        
        .form-card {
            background: white;
            border-radius: 16px;
            box-shadow: var(--box-shadow);
            padding: 40px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .page-title {
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 30px;
            font-size: 2rem;
            text-align: center;
            position: relative;
            padding-bottom: 15px;
        }
        
        .page-title::after {
            content: "";
            position: absolute;
            left: 50%;
            bottom: 0;
            transform: translateX(-50%);
            height: 3px;
            width: 60px;
            background: linear-gradient(to right, var(--primary-color), #6a11cb);
            border-radius: 3px;
        }
        
        .page-subtitle {
            text-align: center;
            color: #6c757d;
            margin-bottom: 30px;
            font-size: 1.1rem;
        }
        
        .form-group {
            margin-bottom: 25px;
        }
        
        .form-label {
            font-weight: 600;
            margin-bottom: 10px;
            color: #555;
            font-size: 1rem;
            display: flex;
            align-items: center;
        }
        
        .form-label i {
            margin-right: 8px;
            color: var(--primary-color);
        }
        
        .required::after {
            content: "*";
            color: var(--error-color);
            margin-left: 4px;
        }
        
        .form-control {
            border-radius: 10px;
            padding: 12px 15px;
            border: 1px solid #dde1e7;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }
        
        .form-control:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 0.2rem rgba(67, 97, 238, 0.25);
        }
        
        textarea.form-control {
            min-height: 150px;
            resize: vertical;
        }
        
        .error-text {
            color: var(--error-color);
            font-size: 0.85rem;
            margin-top: 8px;
        }
        
        .buttons-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 15px;
        }
        
        .btn {
            border-radius: 10px;
            padding: 12px 28px;
            font-weight: 600;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .btn-primary {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
        }
        
        .btn-primary:hover {
            background-color: var(--primary-hover);
            border-color: var(--primary-hover);
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(67, 97, 238, 0.3);
        }
        
        .btn-warning {
            background-color: var(--warning-color);
            border-color: var(--warning-color);
        }
        
        .btn-warning:hover {
            background-color: var(--warning-hover);
            border-color: var(--warning-hover);
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(255, 193, 7, 0.3);
        }
        
        .feature-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4361ee 0%, #3a56d4 100%);
            margin: 0 auto 25px;
        }
        
        .feature-icon i {
            color: white;
            width: 35px;
            height: 35px;
        }
        
        .preview-container {
            width: 150px;
            height: 150px;
            border-radius: 10px;
            margin: 0 auto 20px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            background-color: #f8f9fa;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .preview-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        
        .preview-placeholder {
            width: 50px;
            height: 50px;
            color: #adb5bd;
        }
        
        @media (max-width: 768px) {
            .form-card {
                padding: 30px 20px;
            }
            
            .page-title {
                font-size: 1.8rem;
            }
            
            .buttons-container {
                flex-direction: column;
            }
            
            .btn {
                width: 100% !important;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg fixed-top">
        <div class="container">
            <a class="navbar-brand" href="/">ElectiVote</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="/electivote/home-page">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/electivote/profile-page">Profile</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/electivote/about-us-page">About Us</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/electivote/logout">Logout</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    
    <div class="add-candidate-container">
        <div class="form-card animate__animated animate__fadeIn">
            <div class="text-center mb-4">
                <div class="feature-icon">
                    <i data-feather="user-plus"></i>
                </div>
            </div>
            
            <h2 class="page-title">Add Candidate</h2>
            <p class="page-subtitle">Enter details for a new candidate in this vote</p>
            
            <form method="post" enctype="multipart/form-data">
                <div class="form-group">
                    <label for="candidateName" class="form-label required">
                        <i data-feather="user"></i>
                        Candidate Name
                    </label>
                    <input 
                        type="text" 
                        class="form-control" 
                        id="candidateName" 
                        name="candidateName" 
                        value="{{.candidateName}}" 
                        placeholder="Enter candidate's full name"
                        required
                    >
                    {{if .candidateNameErr}}
                        <div class="error-text">{{.candidateNameErr}}</div>
                    {{end}}
                </div>
                
                <div class="form-group">
                    <label for="candidateDesc" class="form-label required">
                        <i data-feather="file-text"></i>
                        Candidate Description
                    </label>
                    <textarea 
                        class="form-control" 
                        id="candidateDesc" 
                        name="candidateDesc" 
                        rows="5" 
                        placeholder="Enter a description, background, or platform for this candidate"
                    >{{.candidateDescription}}</textarea>
                </div>
                
                <div class="form-group">
                    <label for="candidatePicture" class="form-label required">
                        <i data-feather="image"></i>
                        Candidate Picture
                    </label>
                    
                    <div class="preview-container">
                        <i data-feather="image" class="preview-placeholder" id="preview-placeholder"></i>
                        <img src="#" alt="Preview" class="preview-image" id="preview-image" style="display: none;">
                    </div>
                    
                    <input 
                        type="file" 
                        class="form-control" 
                        id="candidatePicture" 
                        name="candidatePicture" 
                        accept="image/*"
                    >
                    <small class="text-muted">Upload a clear photo of the candidate. Recommended size: 300×300px.</small>
                </div>
                
                <div class="buttons-container">
                    <a href="/electivote/manage-vote-page/{{.voteID}}" class="btn btn-warning" style="width: 180px;">
                        <i data-feather="x" style="width: 18px; height: 18px;"></i>
                        Cancel
                    </a>
                    <button type="submit" class="btn btn-primary" style="width: 180px;">
                        <i data-feather="user-plus" style="width: 18px; height: 18px;"></i>
                        Add Candidate
                    </button>
                </div>
            </form>
        </div>
    </div>
    
    <script>
        feather.replace();
        
        document.getElementById('candidatePicture').addEventListener('change', function(e) {
            const file = e.target.files[0];
            const placeholder = document.getElementById('preview-placeholder');
            const preview = document.getElementById('preview-image');
            
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                    placeholder.style.display = 'none';
                }
                reader.readAsDataURL(file);
            } else {
                preview.style.display = 'none';
                placeholder.style.display = 'block';
            }
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
